<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — TaskFlow</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <!-- Top Demo Inspector Bar -->
  <div id="demo-inspector-bar"></div>

  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-heading">
      <header class="auth-card__header">
        <a href="auth.html" class="brand-mark">
          <span class="brand-mark__glyph" aria-hidden="true">TF</span>
          <span>TaskFlow</span>
        </a>
        <h1 id="auth-heading" class="auth-card__title">Sign in to your workspace</h1>
        <p id="auth-subheading" class="auth-card__subtitle">
          Organize project tasks with role-scoped access control.
        </p>
      </header>

      <!-- Accessible Two-Tab Switcher: Sign in vs Create account -->
      <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
        <button
          type="button"
          role="tab"
          id="tab-login"
          class="auth-tab"
          aria-selected="true"
          aria-controls="panel-login"
        >
          Sign in
        </button>
        <button
          type="button"
          role="tab"
          id="tab-register"
          class="auth-tab"
          aria-selected="false"
          aria-controls="panel-register"
        >
          Create account
        </button>
      </div>

      <div class="auth-card__body">
        <!-- Inline Banner for { error: { code, message } } feedback -->
        <div id="auth-error-banner" class="inline-banner inline-banner--error is-hidden" role="alert"></div>

        <!-- Panel 1: Sign in Form (POST /auth/login) -->
        <form id="panel-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div class="form-field">
            <label for="login-email" class="form-label">Work email</label>
            <input
              type="email"
              id="login-email"
              name="email"
              class="form-input"
              placeholder="alex@taskflow.dev"
              value="alex@taskflow.dev"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-field">
            <label for="login-password" class="form-label">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              value="demo1234"
              autocomplete="current-password"
              required
            />
            <span class="form-hint">
              Access tokens are kept strictly in JS memory (never localStorage) to prevent XSS token theft.
            </span>
          </div>

          <div class="form-actions">
            <button type="submit" id="login-submit-btn" class="btn btn--primary btn--full">
              Sign in to workspace
            </button>
          </div>
        </form>

        <!-- Panel 2: Create account Form (POST /auth/register) -->
        <form
          id="panel-register"
          role="tabpanel"
          aria-labelledby="tab-register"
          class="is-hidden"
          novalidate
        >
          <div class="form-field">
            <label for="register-name" class="form-label">Full name</label>
            <input
              type="text"
              id="register-name"
              name="name"
              class="form-input"
              placeholder="Taylor Vance"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-field">
            <label for="register-email" class="form-label">Work email</label>
            <input
              type="email"
              id="register-email"
              name="email"
              class="form-input"
              placeholder="taylor@taskflow.dev"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-field">
            <label for="register-password" class="form-label">Password</label>
            <input
              type="password"
              id="register-password"
              name="password"
              class="form-input"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="form-actions">
            <button type="submit" id="register-submit-btn" class="btn btn--primary btn--full">
              Create account
            </button>
          </div>
        </form>
      </div>

      <!-- Quick Demo Persona Selector for Testing Roles -->
      <footer class="auth-QuickPersonas">
        <div class="auth-QuickPersonas__title">
          Quick-fill hard-coded JSON accounts (click to sign in):
        </div>
        <div class="auth-QuickPersonas__list">
          <button
            type="button"
            class="persona-chip"
            data-demo-email="alex@taskflow.dev"
          >
            <span class="persona-chip__name">Alex Rivera</span>
            <span class="persona-chip__role">Admin on Core API</span>
          </button>
          <button
            type="button"
            class="persona-chip"
            data-demo-email="samira@taskflow.dev"
          >
            <span class="persona-chip__name">Samira Khan</span>
            <span class="persona-chip__role">Organizer on Core API</span>
          </button>
          <button
            type="button"
            class="persona-chip"
            data-demo-email="maya@taskflow.dev"
          >
            <span class="persona-chip__name">Maya Lin</span>
            <span class="persona-chip__role">Member (Assigned TF-101)</span>
          </button>
          <button
            type="button"
            class="persona-chip"
            data-demo-email="jordan@taskflow.dev"
          >
            <span class="persona-chip__name">Jordan Lee</span>
            <span class="persona-chip__role">Member (Assigned TF-103)</span>
          </button>
        </div>
      </footer>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
